openapi: 3.0.3
info:
  title: Thesis Tutoring Reservation System
  description: Shared API contract. DTOs are generated when this commons module is compiled.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Gateway
tags:
  - name: Users
  - name: Professors
  - name: Availability
  - name: Reservations
  - name: Catalogs
  - name: Notifications
  - name: Admin

paths:
  /users:
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paged list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageDto'
    post:
      tags: [Users]
      summary: Register user (admin only)
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          description: Not found

  /professors/{id}/research-lines:
    get:
      tags: [Professors]
      summary: Professor research lines
      operationId: listProfessorResearchLines
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Header-detail rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProfessorResearchLineDto'
    post:
      tags: [Professors]
      summary: Add a research line to a professor
      operationId: addProfessorResearchLine
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfessorResearchLineCreateDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfessorResearchLineDto'

  /time-slots:
    get:
      tags: [Availability]
      summary: Search available time slots
      operationId: searchTimeSlots
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: professorId
          in: query
          schema:
            type: string
            format: uuid
        - name: researchLineId
          in: query
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Time slots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSlotPageDto'
    post:
      tags: [Availability]
      summary: Create time slot
      operationId: createTimeSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeSlotCreateDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSlotDto'

  /reservations:
    get:
      tags: [Reservations]
      summary: List reservations
      operationId: listReservations
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReservationStatusDto'
      responses:
        '200':
          description: Reservations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationPageDto'
    post:
      tags: [Reservations]
      summary: Create reservation with consultation types
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateDto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationDto'
        '409':
          description: Time slot unavailable

  /reservations/{id}:
    get:
      tags: [Reservations]
      summary: Get reservation
      operationId: getReservation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationDto'

  /reservations/{id}/cancellation:
    post:
      tags: [Reservations]
      summary: Cancel reservation
      operationId: cancelReservation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationDto'

  /catalogs/research-lines:
    get:
      tags: [Catalogs]
      summary: Research line catalog
      operationId: listResearchLines
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogDto'

  /catalogs/consultation-types:
    get:
      tags: [Catalogs]
      summary: Consultation type catalog
      operationId: listConsultationTypes
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogDto'

  /contact:
    post:
      tags: [Notifications]
      summary: Public contact form
      operationId: sendContactInquiry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInquiryCreateDto'
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInquiryDto'

  /admin/settings:
    get:
      tags: [Admin]
      summary: List settings
      operationId: listSettings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettingDto'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    UserTypeDto:
      type: string
      enum: [STUDENT, PROFESSOR, ADMINISTRATOR]
    ExperienceLevelDto:
      type: string
      enum: [BASIC, INTERMEDIATE, EXPERT]
    TimeSlotStatusDto:
      type: string
      enum: [AVAILABLE, BOOKED, CANCELLED]
    ReservationStatusDto:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
    NotificationTypeDto:
      type: string
      enum: [RESERVATION_CONFIRMATION, REMINDER, CANCELLATION, CONTACT]
    NotificationChannelDto:
      type: string
      enum: [EMAIL]
    NotificationStatusDto:
      type: string
      enum: [PENDING, SENT, ERROR]

    UserDto:
      type: object
      required: [id, email, firstName, lastName, type, active]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        type:
          $ref: '#/components/schemas/UserTypeDto'
        active:
          type: boolean
        studentCode:
          type: string
        academicTitle:
          type: string
        position:
          type: string
        tutorProfessorId:
          type: string
          format: uuid

    UserCreateDto:
      type: object
      required: [email, password, firstName, lastName, type]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        type:
          $ref: '#/components/schemas/UserTypeDto'
        studentCode:
          type: string
        academicTitle:
          type: string
        position:
          type: string
        tutorProfessorId:
          type: string
          format: uuid

    CatalogDto:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        active:
          type: boolean

    ProfessorResearchLineDto:
      type: object
      required: [id, professorId, researchLine, experienceLevel]
      properties:
        id:
          type: string
          format: uuid
        professorId:
          type: string
          format: uuid
        researchLine:
          $ref: '#/components/schemas/CatalogDto'
        experienceLevel:
          $ref: '#/components/schemas/ExperienceLevelDto'

    ProfessorResearchLineCreateDto:
      type: object
      required: [researchLineId, experienceLevel]
      properties:
        researchLineId:
          type: string
          format: uuid
        experienceLevel:
          $ref: '#/components/schemas/ExperienceLevelDto'

    TimeSlotDto:
      type: object
      required: [id, professorId, slotDate, startTime, endTime, status]
      properties:
        id:
          type: string
          format: uuid
        professorId:
          type: string
          format: uuid
        slotDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time
        status:
          $ref: '#/components/schemas/TimeSlotStatusDto'

    TimeSlotCreateDto:
      type: object
      required: [professorId, slotDate, startTime, endTime]
      properties:
        professorId:
          type: string
          format: uuid
        slotDate:
          type: string
          format: date
        startTime:
          type: string
          format: time
        endTime:
          type: string
          format: time

    ReservationDetailDto:
      type: object
      required: [id, consultationType]
      properties:
        id:
          type: string
          format: uuid
        consultationType:
          $ref: '#/components/schemas/CatalogDto'
        comment:
          type: string

    ReservationDetailCreateDto:
      type: object
      required: [consultationTypeId]
      properties:
        consultationTypeId:
          type: string
          format: uuid
        comment:
          type: string

    ReservationDto:
      type: object
      required: [id, studentId, timeSlot, status, details]
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        timeSlot:
          $ref: '#/components/schemas/TimeSlotDto'
        status:
          $ref: '#/components/schemas/ReservationStatusDto'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ReservationDetailDto'

    ReservationCreateDto:
      type: object
      required: [studentId, timeSlotId, details]
      properties:
        studentId:
          type: string
          format: uuid
        timeSlotId:
          type: string
          format: uuid
        details:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReservationDetailCreateDto'

    ContactInquiryDto:
      type: object
      required: [id, name, email, message]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        message:
          type: string

    ContactInquiryCreateDto:
      type: object
      required: [name, email, message]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        message:
          type: string

    SettingDto:
      type: object
      required: [id, settingKey, value]
      properties:
        id:
          type: string
          format: uuid
        settingKey:
          type: string
        value:
          type: string
        description:
          type: string

    EmailTemplateDto:
      type: object
      required: [id, code, subject, htmlBody, active]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        subject:
          type: string
        htmlBody:
          type: string
        active:
          type: boolean

    NotificationDto:
      type: object
      required: [id, userId, type, channel, status]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationTypeDto'
        channel:
          $ref: '#/components/schemas/NotificationChannelDto'
        status:
          $ref: '#/components/schemas/NotificationStatusDto'
        payload:
          type: object
          additionalProperties: true
        sentAt:
          type: string
          format: date-time
        errorMessage:
          type: string

    PageMetadataDto:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    UserPageDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserDto'
        page:
          $ref: '#/components/schemas/PageMetadataDto'

    TimeSlotPageDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotDto'
        page:
          $ref: '#/components/schemas/PageMetadataDto'

    ReservationPageDto:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReservationDto'
        page:
          $ref: '#/components/schemas/PageMetadataDto'

    ErrorDto:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: integer
          description: HTTP status code
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
